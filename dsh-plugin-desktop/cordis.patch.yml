# Desktop Host operations compose around the existing Web bundle. Advanced
# mode lets desktop-owned client plugins own the browser carrier and rendered UI.
- insert:
    - id: desktop-shell
      name: dsh-plugin-desktop
      config:
        mode: advanced
    - id: threerouter-integration
      name: dsh-plugin-threerouter
    - id: desktop-terminal
      name: dsh-plugin-desktop/terminal
      disabled: !!js process.platform === 'linux'
    - id: desktop-diagnostics
      name: dsh-plugin-desktop/diagnostics
    - id: desktop-notifications
      name: dsh-plugin-desktop/notifications
    - id: desktop-pnpm
      name: dsh-plugin-desktop/pnpm
    - id: desktop-profiles
      name: dsh-plugin-desktop/profiles
    - id: desktop-updates
      name: dsh-plugin-desktop/updates

# Override the default agent model to Threerouter's deepseek-v4-pro instead of DeepSeek Official.
- id: agent-default-model
  config:
    provider: threerouter
    model: deepseek-v4-pro

# Image/Video plugin: users fill in their own provider API Key here.
# The entry itself is registered by dsh-image-video's bundle patch; this row
# only overrides config so updating the plugin via `git pull` won't conflict.
- id: image-video
  config:
    provider: bxinle
    bxinle:
      apiKey: ''
      baseURL: ''
    wanx:
      apiKey: ''
      baseURL: ''
    seedance:
      apiKey: ''
      baseURL: ''
    defaultImageSize: '1024*1024'
    defaultVideoDuration: 5
    timeoutMs: 60000
    pollIntervalMs: 5000
    pollTimeoutMs: 300000
    retryTimes: 3
    outputsDir: './outputs'

# A desktop launch has no terminal operator waiting for the Web readiness line.
- id: web-runtime
  config:
    openBrowser: false
    printUrl: false
    surfaceContext: true
    trustedHosts: []